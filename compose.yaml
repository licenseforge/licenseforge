# Local development and evaluation only: `docker compose up --build`, then
# http://localhost:8080 and sign in as demo / demo (Keycloak, the realm in
# deploy/compose/). Passwords, the client secret and the master key below are
# public dev values; never use them anywhere else. The setup script runs only on an
# empty volume: after changing deploy/database-setup.sql, `docker compose down -v`.
services:
  db:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      # Creates the five logins and the database, as an operator would (ADR-0009, ADR-0029, ADR-0036).
      - ./deploy/database-setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      # Over TCP: during init, Postgres listens on the socket only, so a socket
      # check would pass before the setup script has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "licenseforge"]
      interval: 2s
      retries: 30

  migrate:
    image: licenseforge:dev
    build: .
    command: ["migrate"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LICENSEFORGE_OWNER_DATABASE_URL: postgres://licenseforge_owner:change-me-owner@db:5432/licenseforge?sslmode=disable
      LICENSEFORGE_DATABASE_ALLOW_PLAINTEXT: "true" # the db container serves no TLS; development only (SC-8)
    depends_on:
      db: {condition: service_healthy}

  server:
    image: licenseforge:dev
    environment:
      LICENSEFORGE_DATABASE_URL: postgres://licenseforge_api:change-me-api@db:5432/licenseforge?sslmode=disable
      LICENSEFORGE_PLATFORM_DATABASE_URL: postgres://licenseforge_admin:change-me-admin@db:5432/licenseforge?sslmode=disable
      LICENSEFORGE_IDENTITY_DATABASE_URL: postgres://licenseforge_login:change-me-login@db:5432/licenseforge?sslmode=disable
      LICENSEFORGE_MASTER_KEYS: dev=ZGV2LW9ubHktbWFzdGVyLWtleS1kby1ub3QtdXNlISE=
      LICENSEFORGE_DATABASE_ALLOW_PLAINTEXT: "true"
      # Sign-in through the keycloak service. The server shares its network
      # namespace (network_mode below), so http://localhost:8081 is the same
      # issuer for the browser and the server; plain http is accepted on
      # loopback hosts only.
      LICENSEFORGE_OIDC_ISSUER: http://localhost:8081/realms/licenseforge
      LICENSEFORGE_OIDC_CLIENT_ID: licenseforge
      LICENSEFORGE_OIDC_CLIENT_SECRET: dev-client-secret
      LICENSEFORGE_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      LICENSEFORGE_BOOTSTRAP_ADMIN: demo@licenseforge.local # platform admin at first sign-in: create a tenant from the Tenants screen
    # Its ports (8080 here) are published by the keycloak service. After
    # restarting keycloak, restart server too: it keeps the old namespace.
    network_mode: service:keycloak
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin # Keycloak's own console, http://localhost:8081/admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/compose/keycloak-realm.json:/opt/keycloak/data/import/licenseforge-realm.json:ro
    # The server's port too: it runs in this service's network namespace.
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    healthcheck:
      # No curl in the image: bash's /dev/tcp against the management port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60
