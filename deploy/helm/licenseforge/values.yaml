# Image. Prefer a digest in production: it is what cosign signatures cover.
image:
  repository: ghcr.io/licenseforge/licenseforge
  tag: ""        # default: the chart's appVersion; add -fips for the FIPS build (ADR-0024)
  digest: ""     # e.g. sha256:...; overrides tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

# Secrets are never put in values (ADR-0005). Create them yourself or with
# External Secrets. The server Secret must NOT contain the owner login.
secrets:
  # Keys: database-url (licenseforge_api), platform-database-url
  # (licenseforge_admin), identity-database-url (licenseforge_login),
  # master-keys (LICENSEFORGE_MASTER_KEYS).
  server: ""
  # Key: owner-database-url (licenseforge_owner). Only the migration Job reads it.
  migrate: ""

# Run `licenseforge migrate` as a pre-install/pre-upgrade hook. Turn off if
# migrations run elsewhere (then upgrade the schema before the Deployment).
migrate:
  enabled: true
  backoffLimit: 2
  # Keep below helm --timeout (default 5m), or Helm gives up while the Job still runs.
  activeDeadlineSeconds: 280

# Seconds the server keeps serving after SIGTERM while readiness fails, so
# load balancers stop routing first. terminationGracePeriodSeconds must exceed
# drain + 15s of graceful shutdown (checked at render). Whole seconds.
drainSeconds: 5
terminationGracePeriodSeconds: 30

extraEnv: []   # e.g. [{name: LICENSEFORGE_ADDR, value: ":8080"}]; not for secrets

# Your ingress controller's or load balancer's addresses (CIDRs, comma-
# separated): only their X-Forwarded-For is believed. Leave empty and every
# client counts as the ingress for the per-address rate limit and in audit
# entries. List proxies only, never client networks.
trustedProxies: ""

# Dashboard login through your OIDC provider (ADR-0003). Off: no login.
oidc:
  enabled: false
  issuer: ""        # exactly the ID token's iss, https
  clientID: ""
  redirectURL: ""   # https://<public host>/auth/callback
  # Client secret from an existing Secret; empty secretName = public client (PKCE only).
  clientSecret:
    secretName: ""
    key: client-secret
  # Server egress to the provider (discovery, keys, token), added to the
  # NetworkPolicy. port is the provider's pod port as the CNI sees it, after
  # the Service's DNAT: 443 for an external IdP, Keycloak's 8443 (or 8080) in
  # the cluster. Empty `to`: any destination on that port only (in-cluster
  # pods, nodes and the API server included; narrow it in production), as
  # databaseTo and dns.to (no 0.0.0.0/0 ipBlock, which some CNIs such as
  # Cilium don't match for pods). Narrow it, e.g.
  # [{ipBlock: {cidr: 203.0.113.0/24}}] or a namespace/pod selector for an
  # in-cluster Keycloak.
  egress:
    port: 443
    to: []

# Audit export to a SIEM (ADR-0036): RFC 5424 syslog over TLS (RFC 5425),
# certificate verification always on, TLS 1.2+. Every entry of every audit
# chain is sent at least once, with its seq and hashes, so the SIEM can check
# continuity. Empty host: no export.
audit:
  export:
    syslog:
      host: ""            # the collector, e.g. siem.example.com
      port: 6514
      serverName: ""      # name its certificate must carry; default host
      caSecret: ""        # Secret with ca.crt (the collector's CA); empty: system roots
      clientSecret: ""    # kubernetes.io/tls Secret (tls.crt, tls.key) for mTLS; empty: no client cert
      sdID: ""            # structured data ID name@PEN; default licenseforge@32473
      # NetworkPolicy egress to the collector. Empty: any destination on port.
      to: []

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}

service:
  type: ClusterIP
  port: 80

# Prometheus metrics on their own port (LICENSEFORGE_METRICS_ADDR), never on
# the http port. No auth: the NetworkPolicy admits only scrapeFrom.
metrics:
  port: 9090
  # Who may scrape (NetworkPolicy peers). Default: pods in the "monitoring"
  # namespace. Empty: nobody (the port stays closed).
  scrapeFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # A ServiceMonitor for the Prometheus Operator (needs its CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}   # e.g. {release: kube-prometheus-stack}, to match your Prometheus

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1   # never blocks node drains, even with one replica

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  # Who may reach the server on 8080. Empty: any pod in any namespace (an
  # ingress controller). Narrow it, e.g. to your ingress namespace.
  ingressFrom: []
  # Where the database is: NetworkPolicy peers, e.g. [{ipBlock: {cidr: 10.0.5.0/24}}]
  # or a namespace/pod selector for an in-cluster database. Empty: any
  # destination on databasePort.
  databaseTo: []
  databasePort: 5432
  # DNS egress. OpenShift's DNS pods listen on 5353. Empty `to` allows any
  # resolver (needed for NodeLocal DNSCache); narrow it, e.g.
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}].
  dns:
    ports: [53]
    to: []

podAnnotations: {}
podLabels: {}   # the chart's app.kubernetes.io/* and helm.sh/chart labels are reserved
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
