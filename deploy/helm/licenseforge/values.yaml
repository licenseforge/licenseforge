# Image. Prefer a digest in production: it is what cosign signatures cover.
image:
  repository: ghcr.io/licenseforge/licenseforge
  tag: ""        # default: the chart's appVersion; add -fips for the FIPS build (ADR-0024)
  digest: ""     # e.g. sha256:...; overrides tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

# Secrets are never put in values (ADR-0005). Create them yourself or with
# External Secrets. The server Secret must NOT contain the owner login.
secrets:
  # Keys: database-url (licenseforge_api), platform-database-url
  # (licenseforge_admin), identity-database-url (licenseforge_login),
  # master-keys (LICENSEFORGE_MASTER_KEYS).
  server: ""
  # Key: owner-database-url (licenseforge_owner). Only the migration Job reads it.
  migrate: ""

# Run `licenseforge migrate` as a pre-install/pre-upgrade hook. Turn off if
# migrations run elsewhere (then upgrade the schema before the Deployment).
migrate:
  enabled: true
  backoffLimit: 2
  # Keep below helm --timeout (default 5m), or Helm gives up while the Job still runs.
  activeDeadlineSeconds: 280

# Seconds the server keeps serving after SIGTERM while readiness fails, so
# load balancers stop routing first. terminationGracePeriodSeconds must exceed
# drain + 15s of graceful shutdown (checked at render). Whole seconds.
drainSeconds: 5
terminationGracePeriodSeconds: 30

# The server, the migration and audit retention refuse database URLs that
# don't verify the server (sslmode=verify-full or verify-ca) unless the host
# is local. true allows plaintext: development clusters only.
databaseAllowPlaintext: false

extraEnv: []   # e.g. [{name: LICENSEFORGE_ADDR, value: ":8080"}]; not for secrets

# Your ingress controller's or load balancer's addresses (CIDRs, comma-
# separated): only their X-Forwarded-For is believed. Leave empty and every
# client counts as the ingress for the per-address rate limit and in audit
# entries. List proxies only, never client networks.
trustedProxies: ""

# The host that serves the API alone (api.example.com), when you split it
# from the dashboard's: API tokens and license keys are accepted only there,
# sessions only on the other hosts. A bare hostname: no scheme, port or
# path. Empty: one host serves both.
apiHost: ""

# The first platform admin (ADR-0031): "issuer|subject", or an email the IdP
# marks verified. Granted at that user's login while there is no platform
# admin, then ignored. Empty: create tenants with `licenseforge tenant create`
# (kubectl exec) instead.
bootstrapAdmin: ""
# What platform admins' sessions need on the platform routes (ADR-0038):
# none (empty: the default), mfa or phishing_resistant.
platformMFAPolicy: ""
# System use notification shown before login (AC-8), plain text up to 4 KB
# (the server checks it at start: too long or with control characters, the
# new pods don't start).
loginBanner: ""
# Dashboard sessions (AC-12), as Go durations. Empty: the server's defaults.
session:
  idleTimeout: ""   # default 1h (5m to 24h)
  maxAge: ""        # default 12h (1h to 24h, at least idleTimeout)

# Dashboard login through your OIDC provider (ADR-0003). Off: no login.
oidc:
  enabled: false
  issuer: ""        # exactly the ID token's iss, https
  clientID: ""
  redirectURL: ""   # https://<public host>/auth/callback
  # Client secret from an existing Secret; empty secretName = public client (PKCE only).
  clientSecret:
    secretName: ""
    key: client-secret
  # Server egress to the provider (discovery, keys, token), added to the
  # NetworkPolicy. port is the provider's pod port as the CNI sees it, after
  # the Service's DNAT: 443 for an external IdP, Keycloak's 8443 (or 8080) in
  # the cluster. Empty `to`: any destination on that port only (in-cluster
  # pods, nodes and the API server included; narrow it in production), as
  # databaseTo and dns.to (no 0.0.0.0/0 ipBlock, which some CNIs such as
  # Cilium don't match for pods). Narrow it, e.g.
  # [{ipBlock: {cidr: 203.0.113.0/24}}] or a namespace/pod selector for an
  # in-cluster Keycloak.
  egress:
    port: 443
    to: []

# Extra CA certificates trusted for outgoing TLS, in addition to the image's
# bundle, by the server, the migration Job and the audit-prune CronJob: e.g.
# an OIDC provider or a database (sslmode=verify-full) with a certificate
# from an internal or enterprise CA. secretName: a Secret with the PEM file
# (several certificates may be concatenated) under key. Empty: the image's
# bundle only. A SIEM sink's own caSecret replaces it for that sink. Read at
# start: restart the pods after changing the Secret.
extraCA:
  secretName: ""
  key: ca.crt

# Audit export to a SIEM (ADR-0036): RFC 5424 syslog over TLS (RFC 5425),
# certificate verification always on, TLS 1.2+. Every entry of every audit
# chain is sent at least once, with its seq and hashes, so the SIEM can check
# continuity. Empty host: no export.
audit:
  export:
    syslog:
      host: ""            # the collector, e.g. siem.example.com
      port: 6514
      serverName: ""      # name its certificate must carry; default host
      caSecret: ""        # Secret with ca.crt (the collector's CA); empty: system roots
      clientSecret: ""    # kubernetes.io/tls Secret (tls.crt, tls.key) for mTLS; empty: no client cert
      sdID: ""            # structured data ID name@PEN; default licenseforge@32473
      # NetworkPolicy egress to the collector. Empty: any destination on port.
      to: []
    # OTLP logs over HTTP with the JSON encoding. Delivered only on a 2xx that
    # rejects no record. Empty endpoint: no export.
    otlp:
      endpoint: ""        # e.g. https://otel-collector.monitoring:4318/v1/logs (egress port taken from it; 443 if none)
      caSecret: ""        # Secret with ca.crt; empty: system roots
      clientSecret: ""    # kubernetes.io/tls Secret for mTLS; empty: no client cert
      headersSecret: ""   # Secret with key headers: k=v,k2=v2 (e.g. an API key)
      to: []

# Audit retention (ADR-0036): a CronJob runs `licenseforge audit prune` with
# the retention login, the only one that deletes audit entries (never given
# to the serving pods). Tenants set their own retention (owners only, 365 to
# 36,500 days); platformDays is the platform chain's (empty: keep everything).
auditRetention:
  enabled: false
  secret: ""          # Secret with retention-database-url (the licenseforge_pruner login)
  schedule: "17 3 * * *"
  platformDays: ""    # e.g. 730; 365 to 36,500
  activeDeadlineSeconds: 3600

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}

service:
  type: ClusterIP
  port: 80

# Prometheus metrics on their own port (LICENSEFORGE_METRICS_ADDR), never on
# the http port. No auth: the NetworkPolicy admits only scrapeFrom.
metrics:
  port: 9090
  # Who may scrape (NetworkPolicy peers). Default: pods in the "monitoring"
  # namespace. Empty: nobody (the port stays closed).
  scrapeFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # A ServiceMonitor for the Prometheus Operator (needs its CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}   # e.g. {release: kube-prometheus-stack}, to match your Prometheus
  # Alert rules (PrometheusRule) for audit write failures, export lag,
  # verification failures or a stalled verifier, and a full rate-limit
  # table (ADR-0036). Rendered only when the Prometheus Operator's CRDs exist
  # and serviceMonitor.enabled is on (otherwise nothing scrapes the metrics).
  alerts:
    enabled: true
    exportLagSeconds: 900
    labels: {}   # e.g. {release: kube-prometheus-stack}, to match your Prometheus's ruleSelector

# Periodic audit chain verification (ADR-0036): the leader replica verifies
# every intervalMinutes (0 = off) and from each chain's anchor every
# fullIntervalHours. The stall alert fires after two missed runs.
auditVerify:
  intervalMinutes: 15
  fullIntervalHours: 168

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1   # never blocks node drains, even with one replica

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Outbound webhooks (ADR-0044): every replica delivers.
webhooks:
  workers: 8          # delivery goroutines per pod; 0: this release delivers none
  # Self-hosted, single-vendor installs only: private ranges webhooks may
  # reach (the server refuses them otherwise). Loopback, link-local and cloud
  # metadata addresses stay refused. Applies to every tenant.
  allowCIDRs: []
  denyCIDRs: []       # more refused ranges, e.g. an operator-chosen NAT64 prefix
  ports: [443]        # receiver ports allowed (by the server and the NetworkPolicy)
  # NetworkPolicy egress to receivers on those ports. Empty `to`: any
  # destination (the server's own checks refuse internal addresses).
  egress:
    to: []

networkPolicy:
  enabled: true
  # Who may reach the server on 8080. Empty: any pod in any namespace (an
  # ingress controller). Narrow it, e.g. to your ingress namespace.
  ingressFrom: []
  # Where the database is: NetworkPolicy peers, e.g. [{ipBlock: {cidr: 10.0.5.0/24}}]
  # or a namespace/pod selector for an in-cluster database. Empty: any
  # destination on databasePort.
  databaseTo: []
  databasePort: 5432
  # DNS egress. OpenShift's DNS pods listen on 5353. Empty `to` allows any
  # resolver (needed for NodeLocal DNSCache); narrow it, e.g.
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}].
  dns:
    ports: [53]
    to: []

podAnnotations: {}
podLabels: {}   # the chart's app.kubernetes.io/* and helm.sh/chart labels are reserved
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
