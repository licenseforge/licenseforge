{{- if .Values.networkPolicy.enabled }}
# Server pods: ingress on 8080 only; egress to DNS and the database only, plus
# the OIDC provider when login is on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "licenseforge.serverSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress: {{- include "licenseforge.egress" . | nindent 4 }}
    {{- if .Values.oidc.enabled }}
    - ports: [{port: {{ .Values.oidc.egress.port }}, protocol: TCP}]
      to: {{- toYaml (.Values.oidc.egress.to | default (list (dict "ipBlock" (dict "cidr" "0.0.0.0/0")) (dict "ipBlock" (dict "cidr" "::/0")))) | nindent 8 }}
    {{- end }}
{{- if .Values.migrate.enabled }}
---
# The migration Job runs as a pre-install/pre-upgrade hook, before normal
# resources exist or change, so its policy is a hook too: present on first
# install, and with this release's rules on upgrade. No ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseforge.fullname" . }}-migrate
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "licenseforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migrate
  policyTypes: [Ingress, Egress]
  egress: {{- include "licenseforge.egress" . | nindent 4 }}
{{- end }}
{{- end }}
