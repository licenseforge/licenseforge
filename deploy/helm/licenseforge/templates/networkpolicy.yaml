{{- if .Values.networkPolicy.enabled }}
# Server pods: ingress on 8080, and on the metrics port from the scrapers only;
# egress to DNS and the database, plus the OIDC provider and SIEM collectors
# when configured, and webhook receivers on webhooks.ports while delivery is on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "licenseforge.serverSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- /* Metrics have no auth: only the scrapers, never "any" (no from at all). */}}
    {{- with dig "scrapeFrom" list (.Values.metrics | default dict) }}
    - ports: [{port: {{ include "licenseforge.metricsPort" $ }}, protocol: TCP}]
      from: {{- toYaml . | nindent 8 }}
    {{- end }}
  egress: {{- include "licenseforge.egress" . | nindent 4 }}
    {{- $sys := include "licenseforge.syslog" . | fromYaml }}
    {{- if $sys.host }}
    # SIEM collector (audit export, ADR-0036). Empty `to`: any destination on that port.
    - ports: [{port: {{ $sys.port | int }}, protocol: TCP}]
      {{- with $sys.to }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- $otlp := include "licenseforge.otlp" . | fromYaml }}
    {{- if $otlp.endpoint }}
    # OTLP collector (audit export, ADR-0036): the endpoint's port (443 if it
    # names none). Empty `to`: any destination on that port.
    {{- $hostport := (urlParse $otlp.endpoint).host }}
    {{- $port := 443 }}
    {{- if regexMatch ":[0-9]+$" $hostport }}{{ $port = regexFind "[0-9]+$" $hostport | int }}{{ end }}
    - ports: [{port: {{ $port }}, protocol: TCP}]
      {{- with $otlp.to }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- $oidc := .Values.oidc | default dict }}
    {{- if $oidc.enabled }}
    {{- /* A rule without a port would allow every port. */}}
    - ports: [{port: {{ required "oidc.egress.port is required" (dig "egress" "port" nil $oidc) }}, protocol: TCP}]
      {{- /* Empty: no `to`, any destination (portable; Cilium's 0.0.0.0/0 doesn't match pods). */}}
      {{- with dig "egress" "to" list $oidc }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- $wh := .Values.webhooks | default dict }}
    {{- if gt (int (dig "workers" 8 $wh)) 0 }}
    {{- $ports := dig "ports" (list 443) $wh }}
    {{- /* A rule without ports would allow every port. */}}
    {{- if not $ports }}{{ fail "webhooks.ports must not be empty" }}{{ end }}
    # Webhook receivers (ADR-0044). Empty `to`: any destination on these
    # ports; the server refuses internal addresses itself.
    - ports:
        {{- range $ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
      {{- with dig "egress" "to" list $wh }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- if (.Values.auditRetention | default dict).enabled }}
---
# The audit retention CronJob: DNS and the database only, no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseforge.fullname" . }}-audit-prune
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "licenseforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-prune
  policyTypes: [Ingress, Egress]
  egress: {{- include "licenseforge.egress" . | nindent 4 }}
{{- end }}
{{- if .Values.migrate.enabled }}
---
# The migration Job runs as a pre-install/pre-upgrade hook, before normal
# resources exist or change, so its policy is a hook too: present on first
# install, and with this release's rules on upgrade. No ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseforge.fullname" . }}-migrate
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "licenseforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migrate
  policyTypes: [Ingress, Egress]
  egress: {{- include "licenseforge.egress" . | nindent 4 }}
{{- end }}
{{- end }}
