{{- $ret := .Values.auditRetention | default dict }}
{{- if $ret.enabled }}
{{- if not $ret.secret }}{{ fail "auditRetention.secret is required when auditRetention.enabled: a Secret with retention-database-url" }}{{ end }}
# Audit retention (ADR-0036): prunes audit chains with the retention login,
# the only one that may delete audit entries. The serving pods never get it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "licenseforge.fullname" . }}-audit-prune
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  schedule: {{ $ret.schedule | default "17 3 * * *" | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ $ret.activeDeadlineSeconds | default 3600 | int }}
      template:
        metadata:
          labels:
            {{- include "licenseforge.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: audit-prune
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {{- include "licenseforge.podSecurityContext" . | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: audit-prune
              image: {{ include "licenseforge.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: [audit, prune]
              securityContext: {{- include "licenseforge.containerSecurityContext" . | nindent 16 }}
              env:
                - name: LICENSEFORGE_RETENTION_DATABASE_URL_FILE
                  value: /etc/licenseforge/secrets/retention-database-url
                {{- with $ret.platformDays }}
                - name: LICENSEFORGE_PLATFORM_AUDIT_RETENTION_DAYS
                  value: {{ . | int | toString | quote }}
                {{- end }}
                {{- include "licenseforge.extraCAEnv" (list . 16) }}
                {{- include "licenseforge.dbPlaintextEnv" (list . 16) }}
              {{- include "licenseforge.jobMounts" (list . 14) }}
              resources: {{- toYaml .Values.resources | nindent 16 }}
          {{- include "licenseforge.jobVolumes" (list . 10 $ret.secret "retention-database-url") }}
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
