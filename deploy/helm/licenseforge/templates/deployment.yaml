{{- if not .Values.secrets.server }}{{ fail "secrets.server is required: a Secret with database-url, platform-database-url, identity-database-url and master-keys" }}{{ end }}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.drainSeconds)) }}{{ fail "drainSeconds must be whole seconds, e.g. 5" }}{{ end }}
{{- if le (int .Values.terminationGracePeriodSeconds) (add (int .Values.drainSeconds) 15) }}{{ fail "terminationGracePeriodSeconds must exceed drainSeconds + 15" }}{{ end }}
{{- /* dig: values reused from a release older than oidc.* have no oidc key. */}}
{{- $oidc := .Values.oidc | default dict }}
{{- $sys := include "licenseforge.syslog" . | fromYaml }}
{{- if and $sys.host (not (regexMatch "^[0-9]+$" (toString $sys.port))) }}{{ fail "audit.export.syslog.port must be a port number" }}{{ end }}
{{- $otlp := include "licenseforge.otlp" . | fromYaml }}
{{- /* Secret volumes of the export sinks: CA (ca.crt) and client certificate (tls.crt, tls.key). */}}
{{- $mounts := list }}
{{- range $sink := list (dict "name" "syslog" "on" $sys.host "ca" $sys.caSecret "client" $sys.clientSecret) (dict "name" "otlp" "on" $otlp.endpoint "ca" $otlp.caSecret "client" $otlp.clientSecret) }}
{{- if and $sink.on $sink.ca }}{{ $mounts = append $mounts (dict "name" (printf "%s-ca" $sink.name) "dir" (printf "/etc/licenseforge/%s/ca" $sink.name) "secret" $sink.ca "client" false) }}{{ end }}
{{- if and $sink.on $sink.client }}{{ $mounts = append $mounts (dict "name" (printf "%s-client" $sink.name) "dir" (printf "/etc/licenseforge/%s/client" $sink.name) "secret" $sink.client "client" true) }}{{ end }}
{{- end }}
{{- $extraCA := .Values.extraCA | default dict }}
{{- if $extraCA.secretName }}{{ $mounts = append $mounts (dict "name" "extra-ca" "dir" "/etc/licenseforge/extra-ca" "secret" $extraCA.secretName "key" (required "extraCA.key is required with extraCA.secretName" $extraCA.key)) }}{{ end }}
{{- if and $oidc.enabled (not (and $oidc.issuer $oidc.clientID $oidc.redirectURL)) }}{{ fail "oidc.enabled needs oidc.issuer, oidc.clientID and oidc.redirectURL" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "licenseforge.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "licenseforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with omit (.Values.podLabels | default dict) "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" "app.kubernetes.io/version" "app.kubernetes.io/managed-by" "helm.sh/chart" }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "licenseforge.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- include "licenseforge.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "licenseforge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "licenseforge.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ include "licenseforge.metricsPort" . }}
          env:
            # Explicit keys, never envFrom: the owner login must not reach serving pods.
            - name: LICENSEFORGE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.server | quote }}, key: database-url}}
            - name: LICENSEFORGE_PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.server | quote }}, key: platform-database-url}}
            - name: LICENSEFORGE_IDENTITY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.server | quote }}, key: identity-database-url}}
            - name: LICENSEFORGE_MASTER_KEYS
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.server | quote }}, key: master-keys}}
            - name: LICENSEFORGE_DRAIN
              value: {{ printf "%ds" (int .Values.drainSeconds) | quote }}
            - name: LICENSEFORGE_METRICS_ADDR
              value: {{ printf ":%s" (include "licenseforge.metricsPort" .) | quote }}
            # Periodic audit verification (ADR-0036); 0 minutes = off.
            - name: LICENSEFORGE_AUDIT_VERIFY_INTERVAL
              value: {{ printf "%dm" (int (dig "intervalMinutes" 15 (.Values.auditVerify | default dict))) | quote }}
            - name: LICENSEFORGE_AUDIT_VERIFY_FULL_INTERVAL
              value: {{ printf "%dh" (int (dig "fullIntervalHours" 168 (.Values.auditVerify | default dict))) | quote }}
            {{- if $extraCA.secretName }}
            # Go reads the image's bundle file and every file in these directories.
            - name: SSL_CERT_DIR
              value: /etc/licenseforge/extra-ca
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: LICENSEFORGE_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- with $sys.host }}
            # SIEM export (ADR-0036): RFC 5424 over TLS, verification always on.
            - name: LICENSEFORGE_AUDIT_SYSLOG_ADDR
              value: {{ include "licenseforge.hostPort" (list . $sys.port) | quote }}
            {{- with $sys.serverName }}
            - name: LICENSEFORGE_AUDIT_SYSLOG_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $sys.sdID }}
            - name: LICENSEFORGE_AUDIT_SYSLOG_SD_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if $sys.caSecret }}
            - name: LICENSEFORGE_AUDIT_SYSLOG_CA_FILE
              value: /etc/licenseforge/syslog/ca/ca.crt
            {{- end }}
            {{- if $sys.clientSecret }}
            - name: LICENSEFORGE_AUDIT_SYSLOG_CERT_FILE
              value: /etc/licenseforge/syslog/client/tls.crt
            - name: LICENSEFORGE_AUDIT_SYSLOG_KEY_FILE
              value: /etc/licenseforge/syslog/client/tls.key
            {{- end }}
            {{- end }}
            {{- with $otlp.endpoint }}
            # SIEM export (ADR-0036): OTLP logs over HTTP (JSON), verification always on.
            - name: LICENSEFORGE_AUDIT_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- if $otlp.caSecret }}
            - name: LICENSEFORGE_AUDIT_OTLP_CA_FILE
              value: /etc/licenseforge/otlp/ca/ca.crt
            {{- end }}
            {{- if $otlp.clientSecret }}
            - name: LICENSEFORGE_AUDIT_OTLP_CERT_FILE
              value: /etc/licenseforge/otlp/client/tls.crt
            - name: LICENSEFORGE_AUDIT_OTLP_KEY_FILE
              value: /etc/licenseforge/otlp/client/tls.key
            {{- end }}
            {{- with $otlp.headersSecret }}
            - name: LICENSEFORGE_AUDIT_OTLP_HEADERS
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: headers}}
            {{- end }}
            {{- end }}
            {{- if $oidc.enabled }}
            - name: LICENSEFORGE_OIDC_ISSUER
              value: {{ $oidc.issuer | quote }}
            - name: LICENSEFORGE_OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            - name: LICENSEFORGE_OIDC_REDIRECT_URL
              value: {{ $oidc.redirectURL | quote }}
            {{- with dig "clientSecret" "secretName" "" $oidc }}
            - name: LICENSEFORGE_OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: {{ required "oidc.clientSecret.key is required with oidc.clientSecret.secretName" (dig "clientSecret" "key" "" $oidc) | quote }}}}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          startupProbe: # covers the startup database connect (up to 30s) before liveness applies
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- with $mounts }}
          volumeMounts:
            {{- range . }}
            - {name: {{ .name }}, mountPath: {{ .dir }}, readOnly: true}
            {{- end }}
          {{- end }}
      {{- with $mounts }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          {{- if .client }}
          secret: {secretName: {{ .secret | quote }}, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}], defaultMode: 0440}  # group: the pod's fsGroup
          {{- else if .key }}
          secret: {secretName: {{ .secret | quote }}, items: [{key: {{ .key | quote }}, path: ca.crt}]}
          {{- else }}
          secret: {secretName: {{ .secret | quote }}, items: [{key: ca.crt, path: ca.crt}]}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
