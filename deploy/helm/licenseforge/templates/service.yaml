apiVersion: v1
kind: Service
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "licenseforge.serverSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # Prometheus scrapes here; the NetworkPolicy admits only metrics.scrapeFrom.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
