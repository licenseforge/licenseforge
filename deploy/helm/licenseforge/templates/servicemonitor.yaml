{{- $sm := dig "serviceMonitor" dict (.Values.metrics | default dict) }}
{{- if $sm.enabled }}
# Prometheus Operator scrape config (needs its CRDs).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels:
    {{- include "licenseforge.labels" . | nindent 4 }}
    {{- with $sm.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels:
      {{- include "licenseforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $sm.interval | default "30s" | quote }}
{{- end }}
