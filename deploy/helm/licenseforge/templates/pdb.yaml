{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "licenseforge.fullname" . }}
  labels: {{- include "licenseforge.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels: {{- include "licenseforge.serverSelectorLabels" . | nindent 6 }}
{{- end }}
