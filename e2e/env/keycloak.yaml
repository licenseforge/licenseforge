# e2e environment (ADR-0041): Keycloak in dev mode as the OIDC provider (ADR-0003), behind
# the ingress at https://__KC__. The realm ConfigMap is created by up.sh.
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak, namespace: __NS__}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args: [start-dev, --import-realm]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
            - {name: KC_HOSTNAME, value: "https://__KC__"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import}]
      volumes: [{name: realm, configMap: {name: keycloak-realm}}]
---
apiVersion: v1
kind: Service
metadata: {name: keycloak, namespace: __NS__}
spec: {selector: {app: keycloak}, ports: [{port: 8080}]}
