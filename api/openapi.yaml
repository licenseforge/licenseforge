    get:
      operationId: getFeature
      summary: Get a feature.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateFeature
      summary: "Change a feature's name, description or unit (JSON Merge Patch). Key and type never change."
      description: "Needs catalog:write on its product."
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/FeaturePatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/features/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/FeatureId"
    post:
      operationId: archiveFeature
      summary: Archive a feature. Its key is kept and never reused; licenses keep what they were granted.
      description: "Needs catalog:write on its product. An archived feature answers 409 invalid_state."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listPlans
      summary: List plans in the caller's product scope, newest first, archived ones included.
      description: "Needs catalog:read. A product_id naming a hidden or missing product gives an empty list."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: product_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlan
      summary: Add a plan (one way of selling a product, ADR-0015).
      description: "Needs catalog:write on the product. A missing or hidden product answers 422 on product_id, an archived one too; a slug already used on the product answers 409. Licenses copy the plan's terms when issued."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanCreate" }
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getPlan
      summary: Get a plan.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePlan
      summary: "Change a plan's name or terms (JSON Merge Patch). Slug and bind type never change; licenses already sold keep their terms."
      description: "Needs catalog:write on its product. The merged terms are checked whole."
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PlanPatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}/features:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getPlanFeatures
      summary: What the plan grants, by feature key (one column of the feature × plan matrix, ADR-0015).
      description: "Needs catalog:read on its product."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanFeatures" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePlanFeatures
      summary: "Change what the plan grants (JSON Merge Patch keyed by feature key). Licenses already sold keep their entitlements."
      description: |
        true grants a boolean feature; a whole number from -1 (unlimited) to
        9007199254740991 sets a limit feature (numbers are read as IEEE
        doubles: near 2^53 a fraction rounds to the nearest whole number); null removes the grant;
        absent keys stay. Every key must be a feature of the plan's product;
        an archived feature can't be granted anew, but its grant can change
        or go. All or nothing; at most 1000 keys. Needs catalog:write on its
        product; audited (plan.features.update, with the keys set and
        removed), unless nothing changed.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PlanFeaturesPatch" }
      responses:
        "200":
          description: What the plan grants after the patch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanFeatures" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: archivePlan
      summary: Archive a plan. No new license is issued from it; licenses already sold keep their terms.
      description: "Needs catalog:write on its product. An archived plan answers 409 invalid_state."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listCustomers
      summary: List customers (archived included), newest first.
      description: "Customers are tenant-wide: customer:read on every product; a product-scoped caller sees none."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCustomer
      summary: Add a customer.
      description: Needs customer:write (managers and up).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      summary: Get a customer.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCustomer
      summary: "Change a customer (JSON Merge Patch): email null clears it; external_refs merges key by key."
      description: Needs customer:write.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/CustomerPatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: archiveCustomer
      summary: Archive a customer. Its licenses stay; no new license can be issued for it.
      description: Needs customer:write. An archived customer answers 409 invalid_state.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listWebhooks
      summary: List the tenant's webhook endpoints, oldest first (at most 10).
      description: Needs webhook:read on every product; a product-scoped caller sees none. URLs show only scheme, host and port.
      responses:
        "200":
          description: All endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWebhook
      summary: Add a webhook endpoint. Its signing secret is in this response only.
      description: |
        Needs webhook:write on every product. Events from creation on, never
        history (ADR-0044). At most 10 endpoints per tenant (409 webhook_limit).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: getWebhook
      summary: One webhook endpoint and its delivery state.
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateWebhook
      summary: Change an endpoint's URL and/or events (a merge patch; neither can be null). Its delivery position stays.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWebhook
      summary: Delete an endpoint with its delivery log.
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: rotateWebhookSecret
      summary: A new signing secret, in this response only. The previous one keeps signing for 24 hours (one previous secret).
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: disableWebhook
      summary: Stop deliveries (the position stays). 409 if already disabled.
      responses:
        "200": { description: Disabled., content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: enableWebhook
      summary: Resume a disabled endpoint at the event it stopped on, with a fresh retry schedule. 409 if not disabled.
      responses:
        "200": { description: Enabled., content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/skip-event:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: skipWebhookEvent
      summary: Pass the event held back (delivery.next_seq), for a payload the receiver will never accept. 409 if it isn't the next event any more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookSkip" }
      responses:
        "200": { description: Skipped., content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/skip-to-now:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: skipWebhookToNow
      summary: Pass every event so far; delivery resumes with the next one.
      responses:
        "200": { description: Skipped., content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: listWebhookDeliveries
      summary: The endpoint's delivery attempts of the last 7 days, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer lf_live_…`. The token's tenant must be the path's tenant."
    session:
      type: apiKey
      in: cookie
      name: __Host-lf_session
      description: Dashboard session (ADR-0020). Refused on a configured API host. Never together with a Bearer token.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session on unsafe methods; from GET /auth/session.
    licenseKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Activation API only: `Authorization: License LF-XXXXX-…` (the license key as the user typed it)."
  parameters:
    FeatureId:
      name: id
      in: path
      required: true
      schema: { type: string, example: ftr_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, example: pln_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, example: prd_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, example: cus_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    LicenseId:
      name: id
      in: path
      required: true
      schema: { type: string, example: lic_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    ActivationId:
      name: activation_id
      in: path
      required: true
      schema: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    Kid:
      name: kid
      in: path
      required: true
      schema: { type: string, example: sk_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    WebhookID:
      name: id
      in: path
      required: true
      schema: { type: string, example: whe_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    Tenant:
      name: tenant
      in: path
      required: true
      description: The tenant's slug or ID (`tnt_…`).
      schema: { type: string }
    ActivationTenant:
      name: tenant
      in: path
      required: true
      description: The tenant's ID (`tnt_…`), the license's `tenant` claim (fingerprints are derived from it).
      schema: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1–255 printable ASCII characters; kept 24 hours (ADR-0032).
      schema: { type: string, maxLength: 255 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque; `next_cursor` of the previous page.
      schema: { type: string }
  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests for this license key (ADR-0034); retry after `Retry-After` seconds.
      headers:
        X-Request-Id: { schema: { type: string } }
        Retry-After: { schema: { type: integer } }
        RateLimit-Policy: { schema: { type: string, example: '"license-key";q=60;w=60' } }
        RateLimit: { schema: { type: string, example: '"license-key";r=0;t=17' } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ActivationRequest:
      type: object
      required: [fingerprint, fp_source]
      properties:
        fingerprint: { type: string, description: "The lease's bind.fp: `sha256:` + 64 lowercase hex (License File Format, Fingerprints).", example: "sha256:81fe9b1a2812e068c320c4264f01b6d4d186a83cc0008fe954fd5d1b6e3f3684" }
        fp_source:
          type: string
          enum: [override, env, kubernetes, machine-id]
          description: Where the fingerprint came from; kubernetes binds the cluster, the others the machine.
        hostname: { type: string, maxLength: 253, description: "Letters, digits, `-`, `.`, `_`." }
        app_version: { type: string, maxLength: 64, description: Printable ASCII. }
        sdk_version: { type: string, maxLength: 64, description: Printable ASCII. }
    DeactivationRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: { type: string }
    Lease:
      type: object
      required: [lease, kid, activation_id, issued_at, expires_at, refresh_after]
      properties:
        lease: { type: string, description: The signed lf1 lease (License File Format); verify it with the SDK. }
        kid: { type: string, description: The signing key's ID. }
        activation_id: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        issued_at: { type: string, format: date-time, description: Server time (ADR-0018). }
        expires_at: { type: string, format: date-time }
        refresh_after: { type: string, format: date-time }
    OfflineActivationRequest:
      type: object
      required: [request]
      additionalProperties: false
      properties:
        request: { type: string, maxLength: 4096, description: "The lfreq1 activation request text, as the machine wrote it." }
    DeactivationReceipt:
      type: object
      required: [receipt]
      additionalProperties: false
      properties:
        receipt: { type: string, maxLength: 4096, description: "The lfrcpt1 deactivation receipt text, as the machine wrote it." }
    OfflineActivation:
      type: object
      required: [license_file, activation_id, kid, file_sha256, expires_at]
      properties:
        license_file: { type: string, description: "The signed lf1 license file (armored) to install on the machine." }
        activation_id: { type: string }
        kid: { type: string }
        file_sha256: { type: string, description: "The hash a deactivation receipt for this file must carry." }
        expires_at: { type: string, format: date-time, nullable: true, description: "The file's exp; null for a perpetual file." }
    Activation:
      type: object
      required: [id, license_id, fingerprint, fp_source, binding, mode, hostname, app_version, sdk_version, first_seen_at, last_seen_at, deactivated_at, created_at]
      properties:
        id: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        license_id: { type: string }
        fingerprint: { type: string, description: "The lease's bind.fp (a hash, never the raw machine ID)." }
        fp_source: { type: string, enum: [override, env, kubernetes, machine-id] }
        binding: { type: string, enum: [machine, cluster] }
        mode: { type: string, enum: [online, offline] }
        hostname: { type: string, nullable: true, description: As the SDK last reported it. }
        app_version: { type: string, nullable: true }
        sdk_version: { type: string, nullable: true }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time, nullable: true, description: Null while it holds a seat. }
        created_at: { type: string, format: date-time }
    ActivationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activation" } }
        next_cursor: { type: string, description: Absent on the last page. }
    AuditEvent:
      type: object
      description: One audit entry, the fields the SIEM export carries (ADR-0036).
      required: [id, tenant_id, seq, occurred_at, actor_type, actor_id, action, object_type, object_id, outcome, source_ip, user_agent, details, prev_hash, hash]
      properties:
        id: { type: string, example: aud_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        tenant_id: { type: string }
        seq: { type: integer, format: int64, description: "1, 2, … in the tenant's chain; retention removes a prefix." }
        occurred_at: { type: string, format: date-time, description: "Database clock, UTC, always six fractional digits (2026-11-05T05:23:00.120000Z): the form `hash` covers." }
        actor_type: { type: string, enum: [user, token, platform, system] }
        actor_id: { type: string, nullable: true }
        action: { type: string, example: license.issue }
        object_type: { type: string, nullable: true }
        object_id: { type: string, nullable: true }
        outcome: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, description: "The action's details. Entries from an API request also carry request_id, that response's X-Request-Id." }
        prev_hash: { type: string, description: Hex; the previous entry's hash (zeros for seq 1). }
        hash:
          type: string
          description: |
            Hex SHA-256 (ADR-0027) over 15 values in this order, each written
            as its length in bytes (4 bytes, big-endian unsigned) followed by
            its bytes: the tag `lf-audit-v1`, `id`, `tenant_id`, `seq` (in
            decimal), `occurred_at` (exactly as sent), `actor_type`,
            `actor_id`, `action`, `object_type`, `object_id`, `outcome`,
            `source_ip`, `user_agent`, `details` (the JSON text exactly as
            sent, byte for byte: take it from the raw response, don't
            re-serialize it) and `prev_hash` as its raw 32 bytes (hex-decoded).
            A null field is the empty string (stored values are never empty).
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: string, description: Absent on the last page. }
    SigningKey:
      type: object
      description: A signing key's public part. Private keys are never returned.
      required: [kid, alg, public_key, status, created_at, activated_at, retired_at]
      properties:
        kid: { type: string, example: sk_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        alg: { type: string, enum: [ed25519] }
        public_key: { type: string, description: "Base64url without padding (RFC 4648 §5), as in the trusted key set (License File Format).", example: K1dYPb52fJP3YCWAkHCq-Yto_8Ix32Cj3226U4PqI6k }
        status:
          type: string
          enum: [pending, active, retired]
          description: "pending: published, never signs; active: signs everything new (at most one); retired: never signs again, private key erased."
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }
