            revoked_token_ids:
              type: array
              items: { type: string }
              description: API tokens this change revoked (ADR-0035); preview them from the token list (created_by, role, product_ids).
            revoked_invitation_ids:
              type: array
              items: { type: string }
              description: Pending invitations this change revoked; preview them from the invitation list (invited_by, role, product_ids).
    MemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        next_cursor: { type: string, description: Absent on the last page. }
    PlatformTenant:
      type: object
      required: [id, slug, name, mfa_policy, created_at, has_members, test]
      properties:
        id: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        test: { type: boolean, description: "A test-mode tenant (ADR-0047). Fixed at creation." }
        slug: { type: string }
        name: { type: string }
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
        created_at: { type: string, format: date-time }
        has_members: { type: boolean, description: "Whether anyone has joined (an owner first). Without members, a platform admin may re-issue the owner invitation." }
    PlatformTenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformTenant" }
        next_cursor: { type: string }
    PlatformTenantCreate:
      type: object
      required: [slug, name, owner_email]
      properties:
        slug: { type: string, maxLength: 63, description: "Lowercase letters and digits joined by single dashes, e.g. acme. It names the tenant in URLs and can't change." }
        name: { type: string, maxLength: 200 }
        owner_email: { type: string, maxLength: 320, description: "Who becomes the tenant's first owner by accepting the invitation, signed in with this verified email." }
        test:
          type: boolean
          default: false
          description: "A test-mode tenant (ADR-0047): for integration and CI, marked in the dashboard and left out of usage measures. It can't change later: create a live tenant to sell."
    PlatformOwnerInvite:
      type: object
      required: [owner_email]
      properties:
        owner_email: { type: string, maxLength: 320, description: "Who becomes the tenant's first owner by accepting the invitation, signed in with this verified email." }
    PlatformTenantCreated:
      type: object
      required: [tenant, invitation]
      properties:
        tenant: { $ref: "#/components/schemas/PlatformTenant" }
        invitation:
          type: object
          required: [id, email, role, expires_at, token]
          properties:
            id: { type: string, example: inv_01jcz5b2y3c4d5e6f7g8h9j0k1 }
            email: { type: string }
            role: { type: string, enum: [owner] }
            expires_at: { type: string, format: date-time }
            token: { type: string, description: For the invite link (/invite#token=…). Shown once, never stored. }
    MfaPolicy:
      type: string
      enum: [none, mfa, phishing_resistant]
      description: |
        The assurance a session needs in this tenant (ADR-0038): none, MFA,
        or phishing-resistant MFA (passkeys or security keys, PIV/CAC), as
        the identity provider asserts it in the ID token (amr/acr).
    TenantPatch:
      type: object
      description: Absent fields stay; none is nullable (null answers 422).
      properties:
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
    TenantUpdated:
      type: object
      required: [id, slug, name, mfa_policy, active_api_tokens]
      properties:
        id: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        slug: { type: string }
        name: { type: string }
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
        active_api_tokens:
          type: integer
          description: Active API tokens, all created before this change and not revoked by it; review them in the token list.
    MemberPatch:
      type: object
      description: Absent fields stay; none is nullable (null answers 422).
      properties:
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids:
          type: array
          items: { type: string }
          description: Replaces the product scope; with all_products absent or false.
    WebhookEventType:
      type: string
      enum: [license.issued, license.revoked, license.suspended, license.reinstated, activation.created, activation.deactivated]
    Webhook:
      type: object
      required: [id, url, events, enabled, disabled_reason, created_at, updated_at, delivery]
      properties:
        id: { type: string, example: whe_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        url: { type: string, description: "Scheme, host and port only: the path and query (which may hold a token) are never shown.", example: "https://hooks.example.com:443" }
        events: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        enabled: { type: boolean }
        disabled_reason: { type: string, nullable: true, description: "Why it was disabled: by a user, a 410 from the receiver, about 28 hours of failures, or a URL or secret that can't be read." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivery: { $ref: "#/components/schemas/WebhookDeliveryState" }
    WebhookDeliveryState:
      type: object
      required: [seq, attempts, next_attempt_at, in_flight, next_seq]
      properties:
        seq: { type: integer, format: int64, description: "The last audit entry passed (events after it are pending)." }
        attempts: { type: integer, description: "Failed attempts of the next event (0 to 8)." }
        next_attempt_at: { type: string, format: date-time, nullable: true, description: "When it is tried again; null: as soon as it's due." }
        in_flight: { type: boolean, description: A send is in progress. }
        next_seq: { type: integer, format: int64, nullable: true, description: "The next event it will send (the one held back while it retries; what skip-event takes); null if none is pending within the next 10,000 audit entries (an endpoint far behind: use skip-to-now)." }
    WebhookList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: { type: string, maxLength: 2048, description: "https; an IP address or an ASCII DNS name (punycode); no credentials or fragment. Where it may point is checked at each delivery." }
        events: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/WebhookEventType" } }
    WebhookUpdate:
      type: object
      properties:
        url: { type: string, maxLength: 2048 }
        events: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/WebhookEventType" } }
    WebhookCreated:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The Standard Webhooks signing secret. Shown once.", example: "whsec_…" }
    WebhookSkip:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
    WebhookDelivery:
      type: object
      required: [id, seq, event_id, event_type, attempt, outcome, error, status_code, duration_ms, attempted_at]
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        event_id: { type: string, description: "The webhook-id header the receiver got (its deduplication key)." }
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        attempt: { type: integer, description: 1 to 8. }
        outcome: { type: string, enum: [success, failure] }
        error: { type: string, nullable: true, description: "A failure in fixed words: timeout, connection failed, tls, redirect, or http and the status. Never an address or a response body.", example: "http 500" }
        status_code: { type: integer, nullable: true }
        duration_ms: { type: integer }
        attempted_at: { type: string, format: date-time }
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        next_cursor: { type: string, description: Absent on the last page. }
    WebhookPayload:
      type: object
      description: |
        The body a receiver gets (ADR-0044), signed per Standard Webhooks v1
        (webhook-id, webhook-timestamp, webhook-signature headers). data is
        WebhookLicenseData for license.* events and WebhookActivationData for
        activation.* events: a snapshot at the change. Fields an older entry
        doesn't have are left out.
      required: [type, timestamp, data]
      properties:
        type: { $ref: "#/components/schemas/WebhookEventType" }
        timestamp: { type: string, format: date-time, description: When the change happened. }
        data: { type: object }
    WebhookLicenseData:
      type: object
      properties:
        license_id: { type: string }
        product_id: { type: string }
        customer_id: { type: string }
        plan: { type: string, description: The plan's slug. }
        status: { $ref: "#/components/schemas/LicenseStatus" }
        expires_at: { type: string, format: date-time, nullable: true, description: "null: never expires." }
    WebhookActivationData:
      type: object
      properties:
        activation_id: { type: string }
        license_id: { type: string }
        product_id: { type: string }
        customer_id: { type: string }
        fingerprint: { type: string }
        binding: { type: string, enum: [machine, cluster] }
        mode: { type: string, enum: [online, offline] }
    ApiTokenPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        next_cursor: { type: string, description: Absent on the last page. }
    ApiTokenCreate:
      type: object
      required: [name, role, all_products]
      properties:
        name: { type: string, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        all_products: { type: boolean }
        product_ids:
          type: array
          items: { type: string }
          description: Required, non-empty, when all_products is false; absent otherwise.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
          default: 7776000
          description: Lifetime; 90 days by default, at most a year.
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: The secret. Shown once, never stored., example: lf_live_… }
