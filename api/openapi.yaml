# LicenseForge management API (ADR-0032). Source of truth: the Go server
# (internal/api/apigen) and the dashboard client are generated from it.
# OpenAPI 3.0.3: oapi-codegen v2 (kin-openapi) supports 3.0 fully; 3.1 is not
# supported by it yet.
openapi: 3.0.3
info:
  title: LicenseForge API
  version: v1
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
  description: |
    Conventions (ADR-0032): JSON with snake_case fields, prefixed IDs, RFC 3339
    UTC times. Clients must ignore unknown fields and tolerate unknown enum
    values. Errors are RFC 9457 problem+json with a stable `code`. Every
    response carries `X-Request-Id`.
servers:
  - url: /api/v1
security:
  - apiToken: []
  - session: []
    csrf: []
paths:
  /tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    patch:
      operationId: updateTenant
      summary: Change the tenant's settings (JSON Merge Patch); today its MFA policy (ADR-0038).
      description: |
        Owners only (tenant:write), from a dashboard session. Raising the MFA
        policy needs a session that already meets the new level (409
        mfa_policy_unmet), so an owner can't lock themselves out. Raising it
        doesn't revoke API tokens; the answer reports how many are active.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUpdated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/api-tokens:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listApiTokens
      summary: List the tenant's API tokens, newest first. Never returns secrets or hashes.
      description: Needs token:read on every product.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApiToken
      summary: Create an API token. The secret is in this response only.
      description: |
        Dashboard sessions only (API tokens can't create tokens), with
        token:write on every product; the role can't exceed the caller's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/api-tokens/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        schema: { type: string, example: tok_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    post:
      operationId: revokeApiToken
      summary: Revoke an active API token. One-way.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/members:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listMembers
      summary: List the tenant's members, newest first.
      description: Needs member:read on every product; a product-scoped caller sees none.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/members/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        schema: { type: string, example: mem_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    patch:
      operationId: updateMember
      summary: Change a member's role or product scope (JSON Merge Patch).
      description: |
        Dashboard sessions with member:write on every product. The caller may
        only give or take away a role it holds itself; the last owner can't
        be demoted (409). A demotion or narrower scope also revokes the
        member's tokens the new grant wouldn't allow, and the pending
        invitations it couldn't have sent (ADR-0035), unless
        revoke_tokens=false / revoke_invitations=false.
      parameters:
        - name: revoke_tokens
          in: query
          description: Revoke the member's active API tokens above the new role or outside the new scope, each audited.
          schema: { type: boolean, default: true }
        - name: revoke_invitations
          in: query
          description: Revoke the member's pending invitations the new grant couldn't have sent, each audited.
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MemberPatch" }
      responses:
        "200":
          description: The changed member, and the tokens the change revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberUpdated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeMember
      summary: Remove a member, by default revoking the API tokens they created and the invitations they sent (ADR-0029, ADR-0035).
      description: Their access ends at once. The last owner can't be removed (409).
      parameters:
        - name: revoke_tokens
          in: query
          description: Also revoke every active API token the member created, each audited.
          schema: { type: boolean, default: true }
        - name: revoke_invitations
          in: query
          description: Also revoke every pending invitation the member sent, each audited.
          schema: { type: boolean, default: true }
      responses:
        "204":
          description: Removed.
          headers:
            X-Revoked-Token-Ids:
              description: Comma-separated IDs of the API tokens the removal revoked; absent if none.
              schema: { type: string }
            X-Revoked-Invitation-Ids:
              description: Comma-separated IDs of the pending invitations the removal revoked; absent if none.
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/invitations:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listInvitations
      summary: List the tenant's invitations (open, accepted, revoked, expired), newest first.
      description: Needs member:read on every product; a product-scoped caller sees none. Never returns the link token.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInvitation
      summary: Invite someone by email. The link token is in this response only.
      description: |
        Dashboard sessions with member:write on every product; the role can't
        exceed the caller's. Open for 7 days. Accepting needs the token, a
        signed-in user whose verified email matches, and an open invitation
        (POST /invitations/accept).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/invitations/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        schema: { type: string, example: inv_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    post:
      operationId: revokeInvitation
      summary: Revoke an open invitation. One-way.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation as the signed-in user.
      description: |
        Dashboard sessions only (outside any tenant path; API tokens get 401).
        An unknown, revoked, expired or used token, and a user whose verified
        email doesn't match, all answer the same 422.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The invite link's token. }
      responses:
        "200":
          description: The new membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/summary:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getSummary
      summary: Exact counts for the dashboard overview, within the caller's scope.
      description: |
        Needs license:read. License counts cover the products the caller
        can see: a product-scoped caller gets the counts of its products.
        `customers` is present only for callers with customer:read on every
        product (customers are tenant-wide), and absent otherwise.

        Lists carry no totals (ADR-0032); this resource is where counts
        live. More counters (for example activations) may be added as new
        members; clients must ignore members they don't know.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/metrics/daily:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getDailyMetrics
      summary: Per-day counts for the dashboard's charts, within the caller's scope (ADR-0046).
      description: |
        Needs license:read. One entry per UTC day (by the server's database
        clock), oldest first, for the last `days` days ending today (today
        is partial); every day is present, with zeros when nothing happened.
        A product-scoped caller counts its products' licenses and their
        activations only. More series may be added as new members; clients
        must ignore members they don't know.
      parameters:
        - name: days
          in: query
          description: How many days, today included.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyMetrics" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listLicenses
      summary: List licenses in the caller's product scope, newest first.
      description: Filters are equality on product, customer and status, and a creation-time range. A filter naming a hidden or missing object gives an empty list.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: product_id, in: query, schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LicenseStatus" } }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicensePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: issueLicense
      summary: Issue a license from a plan. The license key is in this response only.
      description: |
        Needs license:issue on the product. The plan's terms and features are
        copied into the license, with per-license overrides. A missing or
        hidden product, plan or customer answers 422 on its field.
        With Idempotency-Key, a retry within 24 hours gets the first answer
        (the key again included, for the same credential).
      parameters:
        - name: Idempotency-Key
          in: header
          description: 1-255 printable ASCII characters; scoped to the tenant and the credential.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseIssue" }
      responses:
        "201":
          description: Issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseIssued" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    get:
      operationId: getLicense
      summary: Get a license (never its key).
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    post:
      operationId: suspendLicense
      summary: Suspend an active license.
      description: Needs license:write on the license's product. A status that doesn't allow it answers 409 invalid_state.
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/updates-until:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    post:
      operationId: setLicenseUpdatesUntil
      summary: Set a license's maintenance end (renew or correct it).
      description: "ADR-0045. Builds dated after `updates_until` aren't covered; null covers every build. Stored in whole seconds; it must be after the license's issue. Needs license:write on the license's product. A revoked license answers 409 invalid_state. Online leases carry the new value from their next refresh; offline files already issued keep theirs until replaced. Audited as license.updates_until with the previous value."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [updates_until]
              properties:
                updates_until: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/reinstate:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    post:
      operationId: reinstateLicense
      summary: Make a suspended license active again. A revoked license stays revoked.
      description: Needs license:write on the license's product. A status that doesn't allow it answers 409 invalid_state.
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    post:
      operationId: revokeLicense
      summary: Revoke an active or suspended license. Final.
      description: Needs license:write on the license's product. A status that doesn't allow it answers 409 invalid_state.
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/activations:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    get:
      operationId: listActivations
      summary: List a license's activations (machines or clusters), deactivated ones included, newest first.
      description: Needs activation:read on the license's product. A hidden license answers 404 like a missing one.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/activations/{activation_id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
      - $ref: "#/components/parameters/ActivationId"
    post:
      operationId: deactivateActivation
      summary: Deactivate a machine or cluster, freeing its seat, as the SDK's deactivate does.
      description: |
        Needs activation:manage on the license's product; audited. Allowed
        whatever the license's status. Deactivating an activation that is
        already deactivated changes nothing and answers 200 with it.
        Deactivating doesn't count as a seat move; activating a new machine
        afterwards may (ADR-0034).
      responses:
        "200":
          description: The activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/licenses/{id}/rehosts/reset:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/LicenseId"
    post:
      operationId: resetRehosts
      summary: Reset the license's seat-move counter (support rehost, ADR-0039).
      description: |
        Sets rehost_count to 0, so a customer at max_rehosts can move a seat
        to a new machine again; free the old machine first with
        deactivate. Needs activation:manage on the license's product;
        audited (license.rehosts_reset, with the previous count). A count
        already at 0 is answered unchanged, with no entry. A revoked license
        answers 409 invalid_state.
      responses:
        "200":
          description: The license.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/audit-events:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listAuditEvents
      summary: Read the tenant's audit log (ADR-0027), newest first, or from a seq onwards for export.
      description: |
        Needs audit:read on every product (owners and admins). Pages run
        by `seq`, the chain's order: newest first by default; with
        `after_seq`, oldest first from the entry after it (self-export:
        pass the last `seq` you hold). Each entry carries `prev_hash` and
        `hash` so the chain can be checked: each entry's `prev_hash` is the
        previous entry's `hash` (32 zero bytes for seq 1), and `hash` is
        computed from the response alone, as described on
        AuditEvent.hash. Reading is audited as `audit_event.read`, at most
        once per reader per 15 minutes.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: after_seq, in: query, description: "Oldest first, from the entry after this seq (0: from the start). Not with cursor.", schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/signing-keys:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listSigningKeys
      summary: List the tenant's signing keys (ADR-0026), newest first. Public keys only.
      description: Needs key:read on every product. Each item's kid, alg and public_key is the trusted-key entry vendors embed in their builds.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKeyPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSigningKey
      summary: Generate a signing key. The tenant's first key is active; later keys are pending until promoted.
      description: |
        Needs key:write (owners). A pending key never signs: publish its
        public key for vendors to add to their trusted set, then promote
        it. A tenant that already has a pending key answers 409
        pending_key_exists. Audited. Idempotency-Key isn't honoured: a
        retry after a lost answer may get 409 pending_key_exists, or leave
        a pending key you didn't mean to make; discard it.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/signing-keys/{kid}/promote:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Kid"
    post:
      operationId: promoteSigningKey
      summary: Make the pending key active and retire the active key, erasing its private key. Can't be undone.
      description: |
        Needs key:write (owners). Builds that don't trust this kid reject
        every license and lease signed afterwards (ADR-0026). A key that
        isn't the pending key answers 409 invalid_state; an unknown kid,
        404 (audited as a failure). Audited.
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/signing-keys/{kid}/discard:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Kid"
    post:
      operationId: discardSigningKey
      summary: Retire the pending key without it ever signing (rotation abandoned, or the pending key leaked).
      description: Needs key:write (owners). A key that isn't the pending key answers 409 invalid_state. Audited.
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /me/tenants:
    get:
      operationId: listMyTenants
      summary: The signed-in user's tenants, with their role and product scope in each, sorted by slug.
      description: |
        Dashboard sessions only (outside any tenant path; API tokens get 401):
        the dashboard's tenant switcher. Always one page (a user belongs to
        few tenants), so there is no `next_cursor`.
      security:
        - session: []
      responses:
        "200":
          description: Every tenant the user is a member of.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTenantPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      summary: Every tenant, newest first (platform admins, ADR-0042).
      description: |
        Dashboard sessions of platform admins whose account isn't disabled
        (other users get 403 forbidden; API tokens are tenant-scoped and get
        401), meeting LICENSEFORGE_PLATFORM_MFA_POLICY (else 403
        mfa_required, ADR-0038). The reserved platform tenant isn't listed.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenantPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlatformTenant
      summary: Create a tenant and invite its first owner (platform admins, ADR-0042).
      description: |
        Creates the tenant and an owner invitation (every product, open 7
        days) for owner_email, in one transaction. The invitation's token,
        for the invite link (/invite#token=…), is in this response only.
        The platform admin doesn't join the tenant: the owner signs in with
        the invited, verified email and accepts. Audited: tenant.create on
        the platform chain, invitation.create on the new tenant's. Same
        callers as listing; a taken slug (the platform tenant's included) is
        409.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformTenantCreate" }
      responses:
        "201":
          description: The tenant and the owner's invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenantCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/tenants/{id}/owner-invitation:
    parameters:
      - name: id
        in: path
        required: true
        description: The tenant's ID or slug.
        schema: { type: string, maxLength: 63 }
    post:
      operationId: reinvitePlatformTenantOwner
      summary: Give a tenant without an owner a new owner invitation (ADR-0042).
      description: |
        For a tenant whose first owner invitation was lost or expired. Platform
        admins only. Every pending owner invitation of the tenant is revoked
        and a new one is created for owner_email (the same or a corrected
        address); its token is in this response only. Once the tenant has an
        owner it runs its own invitations: 409 `conflict`. An unknown tenant
        is 404. Audited on the platform chain and the tenant's chain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOwnerInvite" }
      responses:
        "201":
          description: The tenant and the new invitation, its token shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTenantCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /activation/tenants/{tenant}/activate:
    parameters:
      - $ref: "#/components/parameters/ActivationTenant"
    post:
      operationId: activate
      summary: Activate this machine or cluster and get a signed lease (SDKs).
      description: |
        Activation API (ADR-0004, ADR-0034): authenticated by the license key,
        not by a token or session. Activating an already active fingerprint
        reuses its activation (no new seat). With `Idempotency-Key`, a retry
        gets the first answer back (ADR-0032). `no_signing_key` (503): the
        tenant has no active signing key yet; nothing was changed, and a
        retry works once an owner generates one.
      security:
        - licenseKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "200":
          description: Activated; the lease.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /activation/tenants/{tenant}/refresh:
    parameters:
      - $ref: "#/components/parameters/ActivationTenant"
    post:
      operationId: refreshLease
      summary: Refresh an active activation's lease (also validate). Never takes a seat.
      description: "`not_activated` (404) asks the SDK to activate again. `offline_seat` (409): the machine's seat is an offline activation (ADR-0043); it uses its offline file. `no_signing_key` (503): the tenant has no active signing key; nothing was changed."
      security:
        - licenseKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationRequest" }
      responses:
        "200":
          description: The new lease.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /activation/tenants/{tenant}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ActivationTenant"
    post:
      operationId: deactivate
      summary: Deactivate this machine or cluster, freeing its seat.
      description: "`offline_seat` (409): an offline seat is returned with a deactivation receipt or from the dashboard (ADR-0043), never here."
      security:
        - licenseKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeactivationRequest" }
      responses:
        "204":
          description: Deactivated.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /tenants/{tenant}/deactivation-receipts:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: returnOfflineSeat
      summary: Return an offline seat on the machine's deactivation receipt (ADR-0043).
      description: |
        The receipt is the `lfrcpt1` text the machine's SDK wrote after
        deleting its license file (license format spec, Offline activation).
        Needs activation:offline on the license's product; a license outside
        the caller's scope, or no file of that machine matching the receipt,
        answers 404. Frees the seat when the receipt names the seat's current
        file; another file of a seat still out (an older one: the machine
        renewed since; or one never issued for it) answers
        `receipt_superseded` (409). A receipt for a seat already free
        answers 200 with the activation unchanged and isn't audited again.
        Allowed whatever the license's status. Audited with the receipt's
        hash. Naturally idempotent: no Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeactivationReceipt" }
      responses:
        "200":
          description: The activation, deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/activation-requests:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: createOfflineActivation
      summary: Answer an offline activation request with a license file for that machine (ADR-0043).
      description: |
        The request is the `lfreq1` text an air-gapped machine's SDK wrote
        (license format spec, Offline activation); it carries the license
        key, so treat it like the key. `no_signing_key` (503): the tenant has
        no active signing key; nothing was changed. Needs activation:offline on the
        license's product; an unknown key or a license outside the caller's
        scope answers 404. The license must be usable (403
        `license_suspended`, `license_revoked`, `license_expired`; no grace)
        and its plan must allow offline use (`offline_not_allowed`, 409). Takes or reuses the
        machine's seat (seat limits and moves as online, ADR-0034); a machine
        activated online answers `online_seat` (409) until it deactivates.
        Each file of a machine is newer than the last, to the second: a
        request within a second of the last file waits for the next one.
        The file's `exp` is the license's expiry, capped at now +
        `max_offline_seconds`; renewal is a new request from that machine.
        Audited with the request's hash, never its content. With
        Idempotency-Key, a retry within 24 hours gets the first answer once
        the caller's rights, the license and the seat are checked again: a
        license revoked since, or a seat returned since (`not_activated`,
        404), gets no file.
      parameters:
        - name: Idempotency-Key
          in: header
          description: 1-255 printable ASCII characters; scoped to the tenant and the credential.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineActivationRequest" }
      responses:
        "201":
          description: The signed license file for that machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineActivation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/products:
    parameters:
