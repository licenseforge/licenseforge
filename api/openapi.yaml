      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/products/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: archiveProduct
      summary: Archive a product. Its licenses and activations keep working; no new license, plan or feature can be created on it.
      description: Needs catalog:write on the product. Products are archived, never deleted (ADR-0015). An archived product answers 409 invalid_state.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/features:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listFeatures
      summary: List features in the caller's product scope, newest first, archived ones included.
      description: "Needs catalog:read. A product_id naming a hidden or missing product gives an empty list."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: product_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeaturePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createFeature
      summary: Add a feature to a product (ADR-0015).
      description: "Needs catalog:write on the product. A missing or hidden product answers 422 on product_id, an archived one too; a key already used on the product (archived features included: keys are never reused) answers 409."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureCreate" }
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/features/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/FeatureId"
    get:
      operationId: getFeature
      summary: Get a feature.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateFeature
      summary: "Change a feature's name, description or unit (JSON Merge Patch). Key and type never change."
      description: "Needs catalog:write on its product."
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/FeaturePatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/features/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/FeatureId"
    post:
      operationId: archiveFeature
      summary: Archive a feature. Its key is kept and never reused; licenses keep what they were granted.
      description: "Needs catalog:write on its product. An archived feature answers 409 invalid_state."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listPlans
      summary: List plans in the caller's product scope, newest first, archived ones included.
      description: "Needs catalog:read. A product_id naming a hidden or missing product gives an empty list."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: product_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlan
      summary: Add a plan (one way of selling a product, ADR-0015).
      description: "Needs catalog:write on the product. A missing or hidden product answers 422 on product_id, an archived one too; a slug already used on the product answers 409. Licenses copy the plan's terms when issued."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanCreate" }
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getPlan
      summary: Get a plan.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePlan
      summary: "Change a plan's name or terms (JSON Merge Patch). Slug and bind type never change; licenses already sold keep their terms."
      description: "Needs catalog:write on its product. The merged terms are checked whole."
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PlanPatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}/features:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getPlanFeatures
      summary: What the plan grants, by feature key (one column of the feature × plan matrix, ADR-0015).
      description: "Needs catalog:read on its product."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanFeatures" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePlanFeatures
      summary: "Change what the plan grants (JSON Merge Patch keyed by feature key). Licenses already sold keep their entitlements."
      description: |
        true grants a boolean feature; a whole number from -1 (unlimited) to
        9007199254740991 sets a limit feature (numbers are read as IEEE
        doubles: near 2^53 a fraction rounds to the nearest whole number); null removes the grant;
        absent keys stay. Every key must be a feature of the plan's product;
        an archived feature can't be granted anew, but its grant can change
        or go. All or nothing; at most 1000 keys. Needs catalog:write on its
        product; audited (plan.features.update, with the keys set and
        removed), unless nothing changed.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/PlanFeaturesPatch" }
      responses:
        "200":
          description: What the plan grants after the patch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanFeatures" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/plans/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: archivePlan
      summary: Archive a plan. No new license is issued from it; licenses already sold keep their terms.
      description: "Needs catalog:write on its product. An archived plan answers 409 invalid_state."
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listCustomers
      summary: List customers (archived included), newest first.
      description: "Customers are tenant-wide: customer:read on every product; a product-scoped caller sees none."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCustomer
      summary: Add a customer.
      description: Needs customer:write (managers and up).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      summary: Get a customer.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCustomer
      summary: "Change a customer (JSON Merge Patch): email null clears it; external_refs merges key by key."
      description: Needs customer:write.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/CustomerPatch" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tenants/{tenant}/customers/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: archiveCustomer
      summary: Archive a customer. Its licenses stay; no new license can be issued for it.
      description: Needs customer:write. An archived customer answers 409 invalid_state.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer lf_live_…`. The token's tenant must be the path's tenant."
    session:
      type: apiKey
      in: cookie
      name: __Host-lf_session
      description: Dashboard session (ADR-0020). Refused on a configured API host. Never together with a Bearer token.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session on unsafe methods; from GET /auth/session.
    licenseKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Activation API only: `Authorization: License LF-XXXXX-…` (the license key as the user typed it)."
  parameters:
    FeatureId:
      name: id
      in: path
      required: true
      schema: { type: string, example: ftr_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, example: pln_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, example: prd_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, example: cus_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    LicenseId:
      name: id
      in: path
      required: true
      schema: { type: string, example: lic_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    ActivationId:
      name: activation_id
      in: path
      required: true
      schema: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    Kid:
      name: kid
      in: path
      required: true
      schema: { type: string, example: sk_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    Tenant:
      name: tenant
      in: path
      required: true
      description: The tenant's slug or ID (`tnt_…`).
      schema: { type: string }
    ActivationTenant:
      name: tenant
      in: path
      required: true
      description: The tenant's ID (`tnt_…`), the license's `tenant` claim (fingerprints are derived from it).
      schema: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1–255 printable ASCII characters; kept 24 hours (ADR-0032).
      schema: { type: string, maxLength: 255 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque; `next_cursor` of the previous page.
      schema: { type: string }
  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        X-Request-Id: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests for this license key (ADR-0034); retry after `Retry-After` seconds.
      headers:
        X-Request-Id: { schema: { type: string } }
        Retry-After: { schema: { type: integer } }
        RateLimit-Policy: { schema: { type: string, example: '"license-key";q=60;w=60' } }
        RateLimit: { schema: { type: string, example: '"license-key";r=0;t=17' } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ActivationRequest:
      type: object
      required: [fingerprint, fp_source]
      properties:
        fingerprint: { type: string, description: "The lease's bind.fp: `sha256:` + 64 lowercase hex (License File Format, Fingerprints).", example: "sha256:81fe9b1a2812e068c320c4264f01b6d4d186a83cc0008fe954fd5d1b6e3f3684" }
        fp_source:
          type: string
          enum: [override, env, kubernetes, machine-id]
          description: Where the fingerprint came from; kubernetes binds the cluster, the others the machine.
        hostname: { type: string, maxLength: 253, description: "Letters, digits, `-`, `.`, `_`." }
        app_version: { type: string, maxLength: 64, description: Printable ASCII. }
        sdk_version: { type: string, maxLength: 64, description: Printable ASCII. }
    DeactivationRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: { type: string }
    Lease:
      type: object
      required: [lease, kid, activation_id, issued_at, expires_at, refresh_after]
      properties:
        lease: { type: string, description: The signed lf1 lease (License File Format); verify it with the SDK. }
        kid: { type: string, description: The signing key's ID. }
        activation_id: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        issued_at: { type: string, format: date-time, description: Server time (ADR-0018). }
        expires_at: { type: string, format: date-time }
        refresh_after: { type: string, format: date-time }
    OfflineActivationRequest:
      type: object
      required: [request]
      additionalProperties: false
      properties:
        request: { type: string, maxLength: 4096, description: "The lfreq1 activation request text, as the machine wrote it." }
    OfflineActivation:
      type: object
      required: [license_file, activation_id, kid, file_sha256, expires_at]
      properties:
        license_file: { type: string, description: "The signed lf1 license file (armored) to install on the machine." }
        activation_id: { type: string }
        kid: { type: string }
        file_sha256: { type: string, description: "The hash a deactivation receipt for this file must carry." }
        expires_at: { type: string, format: date-time, nullable: true, description: "The file's exp; null for a perpetual file." }
    Activation:
      type: object
      required: [id, license_id, fingerprint, fp_source, binding, mode, hostname, app_version, sdk_version, first_seen_at, last_seen_at, deactivated_at, created_at]
      properties:
        id: { type: string, example: act_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        license_id: { type: string }
        fingerprint: { type: string, description: "The lease's bind.fp (a hash, never the raw machine ID)." }
        fp_source: { type: string, enum: [override, env, kubernetes, machine-id] }
        binding: { type: string, enum: [machine, cluster] }
        mode: { type: string, enum: [online, offline] }
        hostname: { type: string, nullable: true, description: As the SDK last reported it. }
        app_version: { type: string, nullable: true }
        sdk_version: { type: string, nullable: true }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time, nullable: true, description: Null while it holds a seat. }
        created_at: { type: string, format: date-time }
    ActivationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activation" } }
        next_cursor: { type: string, description: Absent on the last page. }
    AuditEvent:
      type: object
      description: One audit entry, the fields the SIEM export carries (ADR-0036).
      required: [id, tenant_id, seq, occurred_at, actor_type, actor_id, action, object_type, object_id, outcome, source_ip, user_agent, details, prev_hash, hash]
      properties:
        id: { type: string, example: aud_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        tenant_id: { type: string }
        seq: { type: integer, format: int64, description: "1, 2, … in the tenant's chain; retention removes a prefix." }
        occurred_at: { type: string, format: date-time, description: "Database clock, UTC, always six fractional digits (2026-11-05T05:23:00.120000Z): the form `hash` covers." }
        actor_type: { type: string, enum: [user, token, platform, system] }
        actor_id: { type: string, nullable: true }
        action: { type: string, example: license.issue }
        object_type: { type: string, nullable: true }
        object_id: { type: string, nullable: true }
        outcome: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, description: "The action's details. Entries from an API request also carry request_id, that response's X-Request-Id." }
        prev_hash: { type: string, description: Hex; the previous entry's hash (zeros for seq 1). }
        hash:
          type: string
          description: |
            Hex SHA-256 (ADR-0027) over 15 values in this order, each written
            as its length in bytes (4 bytes, big-endian unsigned) followed by
            its bytes: the tag `lf-audit-v1`, `id`, `tenant_id`, `seq` (in
            decimal), `occurred_at` (exactly as sent), `actor_type`,
            `actor_id`, `action`, `object_type`, `object_id`, `outcome`,
            `source_ip`, `user_agent`, `details` (the JSON text exactly as
            sent, byte for byte: take it from the raw response, don't
            re-serialize it) and `prev_hash` as its raw 32 bytes (hex-decoded).
            A null field is the empty string (stored values are never empty).
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: string, description: Absent on the last page. }
    SigningKey:
      type: object
      description: A signing key's public part. Private keys are never returned.
      required: [kid, alg, public_key, status, created_at, activated_at, retired_at]
      properties:
        kid: { type: string, example: sk_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        alg: { type: string, enum: [ed25519] }
        public_key: { type: string, description: "Base64url without padding (RFC 4648 §5), as in the trusted key set (License File Format).", example: K1dYPb52fJP3YCWAkHCq-Yto_8Ix32Cj3226U4PqI6k }
        status:
          type: string
          enum: [pending, active, retired]
          description: "pending: published, never signs; active: signs everything new (at most one); retired: never signs again, private key erased."
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }
    SigningKeyPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SigningKey" } }
        next_cursor: { type: string, description: Absent on the last page. }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable; clients switch on it. New codes may be added.
          example: not_found
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: JSON Pointer (RFC 6901) into the request body. }
              message: { type: string }
    Role:
      type: string
      enum: [owner, admin, manager, support, viewer, sdk]
    ApiToken:
      type: object
      required: [id, name, role, all_products, product_ids, display, created_by, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, example: tok_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_products: { type: boolean }
        product_ids: { type: array, items: { type: string } }
        display: { type: string, description: Prefix to tell tokens apart, never the secret., example: lf_live_abcdefgh… }
        created_by: { type: string, nullable: true, description: User ID; null once the user is erased. }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    Summary:
      type: object
      required: [licenses]
      description: Each counter is an object, so a counter can gain members and new counters can be added without breaking clients.
      properties:
        licenses:
          type: object
          required: [active, suspended, revoked]
          description: Licenses by status, in the caller's product scope.
          properties:
            active: { type: integer, format: int64 }
            suspended: { type: integer, format: int64 }
            revoked: { type: integer, format: int64 }
        customers:
          type: object
          required: [active, seen_this_month, month_start]
          description: Present only for callers with customer:read on every product.
          properties:
            active: { type: integer, format: int64, description: Customers that aren't archived. }
            seen_this_month:
              type: integer
              format: int64
              description: "Customers with at least one activation seen (activated or refreshed) since month_start, archived customers and deactivated machines included: the active-customer measure (ADR-0016, ADR-0040). Site licenses and offline files aren't seen, and a plan whose lease is longer than about two months may not refresh within a month (undercount)."
            month_start: { type: string, format: date-time, description: "The start of the current calendar month in UTC, by the server's database clock." }
    LicenseStatus:
      type: string
      enum: [active, suspended, revoked]
    License:
      type: object
      required: [id, product_id, plan_id, plan_slug, customer_id, type, status, key_hint, expiry_basis, expires_at, max_activations, active_activations, max_rehosts, rehost_count, entitlements, external_refs, issued_at, suspended_at, revoked_at, created_at]
      properties:
        id: { type: string, example: lic_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        product_id: { type: string }
        plan_id: { type: string }
        plan_slug: { type: string, description: The plan's slug when issued. }
        customer_id: { type: string }
        type: { type: string, enum: [dev, trial, paid, community] }
        status: { $ref: "#/components/schemas/LicenseStatus" }
        key_hint: { type: string, description: The key's last 6 characters, to tell keys apart. Never the key. }
        expiry_basis: { type: string, enum: [from_issue, from_first_activation] }
        expires_at: { type: string, format: date-time, nullable: true, description: Null for a perpetual license, or until first activation. }
        max_activations: { type: integer, nullable: true }
        active_activations: { type: integer, description: Seats taken now (activations not deactivated). }
        max_rehosts: { type: integer, nullable: true, description: "Seat moves allowed (ADR-0034); null is unlimited." }
        rehost_count: { type: integer, description: "Seat moves used since issue or the last reset (ADR-0039)." }
        entitlements:
          type: object
          required: [features, limits]
          properties:
            features: { type: array, items: { type: string } }
            limits: { type: object, additionalProperties: { type: integer, format: int64 } }
        external_refs: { type: object, additionalProperties: { type: string } }
        issued_at: { type: string, format: date-time }
        suspended_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    LicensePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/License" } }
        next_cursor: { type: string, description: Absent on the last page. }
    LicenseIssue:
      type: object
      required: [product_id, plan_id, customer_id]
      properties:
        product_id: { type: string }
        plan_id: { type: string }
        customer_id: { type: string }
        type: { type: string, enum: [dev, trial, paid, community], default: paid }
        overrides:
          type: object
          description: Per-license feature changes by feature key (an enterprise deal).
          additionalProperties:
            type: object
            properties:
              remove: { type: boolean, description: Drop the feature. }
              limit: { type: integer, format: int64, description: For a limit feature (required for one), -1 = unlimited. }
        external_refs:
          type: object
          description: Order, CRM or ERP IDs; at most 20, keys of 1-64 [a-z0-9_.-].
          additionalProperties: { type: string, maxLength: 255 }
    LicenseIssued:
      allOf:
        - $ref: "#/components/schemas/License"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: The license key. Shown once (and on an idempotent replay to the same credential), stored only encrypted. }
    Product:
      type: object
      required: [id, slug, name, archived_at, created_at]
      properties:
        id: { type: string, example: prd_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        slug: { type: string, description: The license's product claim. Immutable. }
        name: { type: string }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Product" } }
        next_cursor: { type: string, description: Absent on the last page. }
    ProductCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, maxLength: 63, description: "Lowercase words joined by single dashes, e.g. db-server." }
        name: { type: string, maxLength: 200 }
    ProductPatch:
      type: object
      description: Absent fields stay; none is nullable (null answers 422).
      properties:
        name: { type: string, maxLength: 200 }
    FeatureType:
      type: string
      enum: [boolean, limit]
    Feature:
      type: object
      required: [id, product_id, key, name, description, type, unit, archived_at, created_at]
      properties:
        id: { type: string, example: ftr_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        product_id: { type: string }
        key: { type: string, description: What apps check (hasFeature, limit). Immutable. }
        name: { type: string }
        description: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/FeatureType" }
        unit: { type: string, nullable: true, description: "For a limit, e.g. users." }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    FeaturePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Feature" } }
        next_cursor: { type: string, description: Absent on the last page. }
    FeatureCreate:
      type: object
      required: [product_id, key, name, type]
      properties:
        product_id: { type: string }
        key: { type: string, maxLength: 63, description: "snake_case, e.g. max_users." }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/FeatureType" }
        unit: { type: string, maxLength: 40 }
    FeaturePatch:
      type: object
      description: "Absent fields stay; description and unit null clears them; name isn't nullable (null answers 422)."
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        unit: { type: string, maxLength: 40, nullable: true }
    Plan:
      type: object
      required: [id, product_id, slug, name, duration_months, duration_seconds, expiry_basis, max_activations, max_rehosts, bind_type, offline_allowed, lease_seconds, max_offline_seconds, grace_seconds, archived_at, created_at]
      properties:
        id: { type: string, example: pln_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        product_id: { type: string }
        slug: { type: string, description: "Copied into licenses. Immutable." }
        name: { type: string }
        duration_months: { type: integer, minimum: 1, maximum: 1200, nullable: true, description: "Calendar months (monthly, yearly billing). At most one of duration_months and duration_seconds; neither is perpetual." }
        duration_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000, nullable: true, description: "Whole seconds (trials, fixed periods)." }
        expiry_basis: { type: string, enum: [from_issue, from_first_activation] }
        max_activations: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        max_rehosts: { type: integer, minimum: 0, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        offline_allowed: { type: boolean }
        lease_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000 }
        max_offline_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000, nullable: true }
        grace_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000 }
        bind_type: { type: string, enum: [none, machine, cluster], description: "What an activation binds to; none is a site license (no activations). Immutable." }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PlanPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        next_cursor: { type: string, description: Absent on the last page. }
    PlanCreate:
      type: object
      required: [product_id, slug, name]
      description: "Defaults: expiry_basis from_issue, bind_type machine, offline_allowed false, lease_seconds 604800 (7 days), grace_seconds 0; the nullable terms absent are null."
      properties:
        product_id: { type: string }
        slug: { type: string, maxLength: 63 }
        name: { type: string, maxLength: 200 }
        duration_months: { type: integer, minimum: 1, maximum: 1200, nullable: true, description: "Calendar months (monthly, yearly billing). At most one of duration_months and duration_seconds; neither is perpetual." }
        duration_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000, nullable: true, description: "Whole seconds (trials, fixed periods)." }
        expiry_basis: { type: string, enum: [from_issue, from_first_activation] }
        max_activations: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        max_rehosts: { type: integer, minimum: 0, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        offline_allowed: { type: boolean }
        lease_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000 }
        max_offline_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000, nullable: true }
        grace_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000 }
        bind_type: { type: string, enum: [none, machine, cluster], description: "What an activation binds to; none is a site license (no activations). Immutable." }
    PlanFeatures:
      type: object
      description: "Feature key → true (a boolean feature granted) or the limit (a limit feature; -1 unlimited). Features the plan doesn't grant are absent."
      additionalProperties: true
      example: { sso: true, max_users: 50 }
    PlanFeaturesPatch:
      type: object
      description: "Feature key → true, a whole number from -1 to 9007199254740991, or null (remove)."
      additionalProperties: true
      example: { export: null, max_users: -1 }
    PlanPatch:
      type: object
      description: "Absent fields stay; null clears a nullable term; name, expiry_basis, offline_allowed, lease_seconds and grace_seconds aren't nullable (null answers 422)."
      properties:
        name: { type: string, maxLength: 200 }
        duration_months: { type: integer, minimum: 1, maximum: 1200, nullable: true, description: "Calendar months (monthly, yearly billing). At most one of duration_months and duration_seconds; neither is perpetual." }
        duration_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000, nullable: true, description: "Whole seconds (trials, fixed periods)." }
        expiry_basis: { type: string, enum: [from_issue, from_first_activation] }
        max_activations: { type: integer, minimum: 1, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        max_rehosts: { type: integer, minimum: 0, maximum: 1000000, nullable: true, description: "Null is unlimited." }
        offline_allowed: { type: boolean }
        lease_seconds: { type: integer, format: int64, minimum: 1, maximum: 3153600000 }
        max_offline_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000, nullable: true }
        grace_seconds: { type: integer, format: int64, minimum: 0, maximum: 3153600000 }
    Customer:
      type: object
      required: [id, name, email, external_refs, archived_at, created_at]
      properties:
        id: { type: string, example: cus_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        name: { type: string }
        email: { type: string, nullable: true }
        external_refs: { type: object, additionalProperties: { type: string } }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CustomerPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        next_cursor: { type: string, description: Absent on the last page. }
    CustomerCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        external_refs:
          type: object
          description: "Order, CRM or ERP IDs; at most 20, keys of 1-64 [a-z0-9_.-]."
          additionalProperties: { type: string, maxLength: 255 }
    CustomerPatch:
      type: object
      description: "Absent fields stay; email null clears it; name and external_refs aren't nullable (null answers 422). external_refs merges key by key (RFC 7396): a value sets its key, a null member removes it, absent keys stay; the merged refs are checked whole."
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320, nullable: true }
        external_refs: { type: object, additionalProperties: { type: string, maxLength: 255, nullable: true } }
    MemberRole:
      type: string
      enum: [owner, admin, manager, support, viewer]
    Member:
      type: object
      required: [id, user_id, email, name, role, all_products, product_ids, created_at]
      properties:
        id: { type: string, example: mem_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        user_id: { type: string }
        email: { type: string, nullable: true, description: Verified email, if any. }
        name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, all_products, product_ids, status, invited_by, created_at, expires_at, accepted_at, accepted_by, revoked_at]
      properties:
        id: { type: string, example: inv_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        email: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids: { type: array, items: { type: string } }
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        invited_by: { type: string, nullable: true, description: User ID; null once the user is erased. }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        accepted_by: { type: string, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    InvitationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        next_cursor: { type: string, description: Absent on the last page. }
    InvitationCreate:
      type: object
      required: [email, role, all_products]
      properties:
        email: { type: string, maxLength: 320 }
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids:
          type: array
          items: { type: string }
          description: Required, non-empty, when all_products is false; absent otherwise.
    InvitationCreated:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: For the invite link. Shown once, never stored. }
    AcceptedInvitation:
      type: object
      required: [membership_id, tenant_id, role, all_products]
      properties:
        membership_id: { type: string }
        tenant_id: { type: string, description: "Usable as {tenant} in paths." }
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
    MyTenant:
      type: object
      required: [tenant_id, slug, name, role, all_products, product_ids, mfa_policy, accessible]
      properties:
        tenant_id: { type: string, description: "Usable as {tenant} in paths." }
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
        accessible:
          type: boolean
          description: Whether this session meets the tenant's MFA policy (ADR-0038). If not, the tenant's routes answer 403 mfa_required with a step-up URL.
        slug: { type: string, description: "The dashboard's /t/{slug}/." }
        name: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids: { type: array, items: { type: string }, description: The scope when all_products is false; empty otherwise. }
    MyTenantPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MyTenant" } }
    MemberUpdated:
      allOf:
        - $ref: "#/components/schemas/Member"
        - type: object
          required: [revoked_token_ids, revoked_invitation_ids]
          properties:
            revoked_token_ids:
              type: array
              items: { type: string }
              description: API tokens this change revoked (ADR-0035); preview them from the token list (created_by, role, product_ids).
            revoked_invitation_ids:
              type: array
              items: { type: string }
              description: Pending invitations this change revoked; preview them from the invitation list (invited_by, role, product_ids).
    MemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Member" } }
        next_cursor: { type: string, description: Absent on the last page. }
    PlatformTenant:
      type: object
      required: [id, slug, name, mfa_policy, created_at]
      properties:
        id: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        slug: { type: string }
        name: { type: string }
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
        created_at: { type: string, format: date-time }
    PlatformTenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformTenant" }
        next_cursor: { type: string }
    PlatformTenantCreate:
      type: object
      required: [slug, name, owner_email]
      properties:
        slug: { type: string, maxLength: 63, description: "Lowercase letters and digits joined by single dashes, e.g. acme. It names the tenant in URLs and can't change." }
        name: { type: string, maxLength: 200 }
        owner_email: { type: string, maxLength: 320, description: "Who becomes the tenant's first owner by accepting the invitation, signed in with this verified email." }
    PlatformTenantCreated:
      type: object
      required: [tenant, invitation]
      properties:
        tenant: { $ref: "#/components/schemas/PlatformTenant" }
        invitation:
          type: object
          required: [id, email, role, expires_at, token]
          properties:
            id: { type: string, example: inv_01jcz5b2y3c4d5e6f7g8h9j0k1 }
            email: { type: string }
            role: { type: string, enum: [owner] }
            expires_at: { type: string, format: date-time }
            token: { type: string, description: For the invite link (/invite#token=…). Shown once, never stored. }
    MfaPolicy:
      type: string
      enum: [none, mfa, phishing_resistant]
      description: |
        The assurance a session needs in this tenant (ADR-0038): none, MFA,
        or phishing-resistant MFA (passkeys or security keys, PIV/CAC), as
        the identity provider asserts it in the ID token (amr/acr).
    TenantPatch:
      type: object
      description: Absent fields stay; none is nullable (null answers 422).
      properties:
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
    TenantUpdated:
      type: object
      required: [id, slug, name, mfa_policy, active_api_tokens]
      properties:
        id: { type: string, example: tnt_01jcz5b2y3c4d5e6f7g8h9j0k1 }
        slug: { type: string }
        name: { type: string }
        mfa_policy: { $ref: "#/components/schemas/MfaPolicy" }
        active_api_tokens:
          type: integer
          description: Active API tokens, all created before this change and not revoked by it; review them in the token list.
    MemberPatch:
      type: object
      description: Absent fields stay; none is nullable (null answers 422).
      properties:
        role: { $ref: "#/components/schemas/MemberRole" }
        all_products: { type: boolean }
        product_ids:
          type: array
          items: { type: string }
          description: Replaces the product scope; with all_products absent or false.
    ApiTokenPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        next_cursor: { type: string, description: Absent on the last page. }
    ApiTokenCreate:
      type: object
      required: [name, role, all_products]
      properties:
        name: { type: string, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        all_products: { type: boolean }
        product_ids:
          type: array
          items: { type: string }
          description: Required, non-empty, when all_products is false; absent otherwise.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
          default: 7776000
          description: Lifetime; 90 days by default, at most a year.
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: The secret. Shown once, never stored., example: lf_live_… }
