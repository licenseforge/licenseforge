version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /compliance # OSCAL schema validator (test-only module)
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: # one PR per week, not one per package
      web: { patterns: ["*"] }
    ignore: # typescript-eslint supports TypeScript < 6.1 only; lift when it supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
