version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /compliance # OSCAL schema validator (test-only module)
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: # one PR per week, not one per package
      web: { patterns: ["*"] }
    ignore: # typescript-eslint supports TypeScript < 6.1 only; lift when it supports newer
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: npm
    directory: /sdk/ts # dev dependencies only: the SDK has none at runtime
    schedule: { interval: weekly }
    groups:
      sdk-ts: { patterns: ["*"] }
  - package-ecosystem: maven
    directory: /sdk/java # JUnit and the build plugins: the SDK has no runtime dependencies
    schedule: { interval: weekly }
    groups:
      sdk-java: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: / # the Dockerfile's digest-pinned base images
    schedule: { interval: weekly }
    ignore: # Node majors move with web/ (package.json engines, .nvmrc), as one change
      - dependency-name: library/node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: # every github/codeql-action step must run the same version
      codeql: { patterns: ["github/codeql-action*"] }
