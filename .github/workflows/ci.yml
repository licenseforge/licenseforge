name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  # ADR-0009 supports PostgreSQL 15+; the main job runs 17. Migrations and RLS
  # tests must also pass on the oldest supported version.
  store-pg15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:40e8c839f86c404f9bd1c456bb83f11b205f2cd95d753b34c2d074e89ecee786
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LICENSEFORGE_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Database setup script runs
        run: psql "$LICENSEFORGE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/database-setup.sql
      - run: go test -count=1 ./internal/store/...
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      LICENSEFORGE_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      LICENSEFORGE_DEV_DATABASE_URL: postgres://postgres:ci@localhost:5432/lf_dev?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: make vet
      - name: Generated code is up to date
        run: make generate && git diff --exit-code
      - name: Database setup script runs
        run: psql "$LICENSEFORGE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/database-setup.sql
      - name: Migrations match the schema
        run: |
          psql "$LICENSEFORGE_TEST_DATABASE_URL" -qc 'CREATE DATABASE lf_dev'
          make migrate-check
      - run: make vet-cross
      - run: make test
      - name: Test in FIPS 140-3 mode (CMVP-validated Go module)
        run: make test-fips
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { working-directory: sdk/go }
      - run: make build
  sdk-os:
    # Fingerprint sources are OS-specific; run them where they live.
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: sdk/go/go.mod }
      - name: Test SDK
        working-directory: sdk/go
        run: go test ./...
