name: TypeScript SDK
# sdk/ts (ADR-0010): built and tested against the shared conformance vectors
# on the supported Node LTS lines. Path-filtered like web.yml.
on:
  push:
    branches: [main]
    paths: [sdk/ts/**, spec/**, .github/workflows/sdk-ts.yml]
  pull_request:
    paths: [sdk/ts/**, spec/**, .github/workflows/sdk-ts.yml]
permissions:
  contents: read
jobs:
  sdk-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run: { working-directory: sdk/ts }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - run: npm test
