name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "23 4 * * 1" }]
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning and Scorecard publishing need a public repo on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: { languages: go, build-mode: autobuild }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
