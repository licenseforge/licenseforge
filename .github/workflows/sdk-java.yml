name: Java SDK
# sdk/java (ADR-0010, ADR-0023 amended): built and tested against the shared
# conformance vectors on every supported LTS JDK, compiled for Java 17.
# Path-filtered like sdk-ts.yml.
on:
  push:
    branches: [main]
    paths: [sdk/java/**, spec/**, .github/workflows/sdk-java.yml]
  pull_request:
    paths: [sdk/java/**, spec/**, .github/workflows/sdk-java.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  MAVEN_VERSION: 3.9.16
  # Apache's published SHA-512 of apache-maven-3.9.16-bin.tar.gz.
  MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
jobs:
  sdk-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - name: Maven, pinned and checksum-verified (not the runner's)
        run: |
          curl -fsSL -o maven.tgz "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  maven.tgz" | sha512sum -c
          mkdir -p "$RUNNER_TEMP/maven" && tar -xzf maven.tgz -C "$RUNNER_TEMP/maven" --strip-components=1 && rm maven.tgz
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"
      - name: Test (dependencies verified against their published checksums)
        working-directory: sdk/java
        run: mvn -B -ntp --strict-checksums verify
